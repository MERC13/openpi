# Wraps openpi/examples/libero/compose.yml for Phase B.
#
# openpi's compose.yml is left untouched. The only change here is that
# `runtime` builds from steering_rl/docker/libero.Dockerfile (a patched copy,
# see that file's header) instead of examples/libero/Dockerfile, to fix an
# easydict/setuptools build failure under Python 3.8. `openpi_server` is
# identical to openpi's own service definition.
#
# Run with (from the openpi repo root):
#   SERVER_ARGS="--env LIBERO" docker compose -f steering_rl/docker/compose.libero.yml up --build
services:
  runtime:
    image: libero
    depends_on:
      - openpi_server
    build:
      context: ../..
      dockerfile: steering_rl/docker/libero.Dockerfile
    init: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - ../..:/app
      - ../../data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - CLIENT_ARGS
      - DISPLAY=$DISPLAY
      - MUJOCO_GL=${MUJOCO_GL:-egl}
      - MUJOCO_EGL_DEVICE_ID=0
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYOPENGL_PLATFORM=egl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  openpi_server:
    image: openpi_server
    build:
      context: ../..
      dockerfile: scripts/docker/serve_policy.Dockerfile
    init: true
    tty: true
    network_mode: host
    volumes:
      - ../..:/app
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
    environment:
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - IS_DOCKER=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
