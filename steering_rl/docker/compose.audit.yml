# Phase C steerability audit: same Docker flow as compose.libero.yml, but the
# runtime container runs our audit sweep instead of openpi's stock main.py.
#
# The repo is volume-mounted into the container (../..:/app), so steering_rl/ is
# already present at runtime and no image rebuild is needed to change our code —
# we just override the runtime `command`. The `libero` and `openpi_server`
# images are identical to compose.libero.yml (build them there first, or let
# this compose build them once).
#
# Run with (from the openpi repo root, server + audit together):
#   SERVER_ARGS="--env LIBERO" \
#   CLIENT_ARGS="--host 0.0.0.0 --port 8000" \
#   docker compose -f steering_rl/docker/compose.audit.yml up --build
services:
  runtime:
    image: libero
    depends_on:
      - openpi_server
    build:
      context: ../..
      dockerfile: steering_rl/docker/libero.Dockerfile
    init: true
    tty: true
    network_mode: host
    privileged: true
    command:
      - /bin/bash
      - -c
      - source /.venv/bin/activate && python steering_rl/libero/run_audit.py $CLIENT_ARGS
    volumes:
      - ../..:/app
      - ../../data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - CLIENT_ARGS
      - DISPLAY=$DISPLAY
      - MUJOCO_GL=${MUJOCO_GL:-egl}
      - MUJOCO_EGL_DEVICE_ID=0
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYOPENGL_PLATFORM=egl
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  openpi_server:
    image: openpi_server
    build:
      context: ../..
      dockerfile: scripts/docker/serve_policy.Dockerfile
    init: true
    tty: true
    network_mode: host
    volumes:
      - ../..:/app
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
    environment:
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - IS_DOCKER=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
